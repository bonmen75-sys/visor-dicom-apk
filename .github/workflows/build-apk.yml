name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Instalar dependencias y compilar Web
        run: |
          npm install
          npm run build
      - name: Crear proyecto Android y configurar WebView sin restricciones
        run: |
          npx cap add android
          npx cap sync android
          python3 -c '
import os, glob

main_act = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
with open(main_act, "r") as f:
    code = f.read()

injection = """import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
    @Override
    public void onStart() {
        super.onStart();
        WebView webView = getBridge().getWebView();
        WebSettings settings = webView.getSettings();
        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);
    }
}
"""
with open(main_act, "w") as f:
    f.write(injection)
'
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Subir archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: MedView-DICOM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk